[project]
name = "storage-service"
version = "0.2.1"
description = "File storage service for uploading, storing, and serving large files"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django==6.0.8",
    "djangorestframework==3.17.2",
    "drf-spectacular==0.29.0",
    "django-cors-headers==4.9.0",
    "django-storages[s3]==1.14.6",
    "python-dotenv==1.2.2",
    "dj-database-url==3.1.2",
    "psycopg[binary]==3.3.4",
    "gunicorn==26.0.0",
    "whitenoise==6.12.0",
    "sentry-sdk==2.63.0",
    "cryptography==50.0.0",
    "pyjwt==2.13.0",
    "requests==2.33.0",
    "markdown==3.10.2",
    "prometheus-client==0.21.1",
    "sqlparse==0.6.0",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
