[project]
name = "storage-service"
version = "0.1.0"
description = "Supabase-compatible object storage backend for ShellUI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django==6.0.3",
    "djangorestframework==3.17.1",
    "drf-spectacular==0.29.0",
    "django-cors-headers==4.9.0",
    "django-storages[s3]==1.14.6",
    "python-dotenv==1.2.2",
    "dj-database-url==3.1.2",
    "psycopg[binary]==3.3.4",
    "gunicorn==26.0.0",
    "whitenoise==6.12.0",
    "sentry-sdk==2.63.0",
    "cryptography==46.0.1",
    "pyjwt==2.10.1",
    "requests==2.32.5",
    "markdown==3.10.2",
    "prometheus-client==0.21.1",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
