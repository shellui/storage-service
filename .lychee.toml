# Lychee — markdown / docs link checker (CI: .github/workflows/ci.yml)
# https://github.com/lycheeverse/lychee

#############################  Cache  ##############################

cache = true
max_cache_age = "2d"
# Never cache server errors, so a transient 5xx is re-checked next time.
cache_exclude_status = "500.."

#############################  Runtime  ############################

max_concurrency = 8
timeout = 20
# Lychee 0.24 retries connection failures, not an HTTP status code.
# A 404 still fails. 429 and brief gateway errors (502, 503, 504) do not:
# GitHub returns 503 for valid pages when it is busy.
max_retries = 5
retry_wait_time = 3
accept = ["200", "204", "206", "429", "502", "503", "504"]

#############################  Excludes  ###########################

# Local / placeholder hosts used in docs and README examples
exclude = [
  '^https?://localhost(:[0-9]+)?(/|$)',
  '^https?://127\.0\.0\.1(:[0-9]+)?(/|$)',
  '^https?://\[::1\](:[0-9]+)?(/|$)',
  '^https?://([^/]*\.)?example\.com(/|$)',
  '^https?://id\.example(/|$)',
  # Angle-bracket placeholders in docs tables
  '^https?://<',
  # Service pages on docs.shellui.com go live when shellui/shellui deploys the
  # central docs site. Until then the Docs build job in ci.yml builds these pages.
  '^https://docs\.shellui\.com/(identity|storage|hosting|email)(/|$)',
]

exclude_path = [
  '\.venv',
]

scheme = ['https', 'http']
include_verbatim = false
