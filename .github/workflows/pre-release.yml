name: Pre-release check

# Automates PUBLISH.md pre-release checklist (version alignment, image secrets, smoke test).
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pre-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  pre-release:
    name: Pre-release checklist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.10'
          python-version: '3.14.10'
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Sync dependencies
        run: uv sync --frozen --no-dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run pre-release checklist
        run: |
          chmod +x ./tools/pre-release-check.sh
          ./tools/pre-release-check.sh --image shellui/storage-service:pre-release
