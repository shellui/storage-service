# Extends the built-in rules. CI runs `gitleaks detect` with full history,
# so this allowlist also covers the handbook placeholder in earlier commits.
[extend]
useDefault = true

[allowlist]
description = "Docs placeholder and MCP package sync test hashes (not secrets)"
regexes = ['''your_access_token_here''']
paths = [
  '''apps/storage/tests/test_shellui_mcp_sync\.py''',
]
